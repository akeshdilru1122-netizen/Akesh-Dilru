<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUSH 🎮</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  background:#050510;
  font-family:Arial,sans-serif;
  color:white;
}

canvas{
  display:block;
  background:
    radial-gradient(circle at center,#15154d 0%,#050510 70%);
}

#ui{
  position:fixed;
  top:15px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  font-size:20px;
  font-weight:bold;
  text-shadow:0 0 10px #00ffff;
  pointer-events:none;
}

#startScreen{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,20,.82);
  text-align:center;
}

h1{
  font-size:60px;
  color:#00ffff;
  text-shadow:
    0 0 10px #00ffff,
    0 0 30px #0066ff,
    0 0 60px #ff00ff;
  margin-bottom:15px;
}

p{
  font-size:18px;
  margin-bottom:25px;
  color:#ddd;
}

button{
  padding:15px 40px;
  border:2px solid #00ffff;
  border-radius:30px;
  background:transparent;
  color:#00ffff;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 20px #00ffff;
  transition:.2s;
}

button:hover{
  background:#00ffff;
  color:#050510;
  transform:scale(1.08);
}

#gameOver{
  display:none;
  position:fixed;
  inset:0;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(0,0,20,.85);
}

#gameOver h2{
  font-size:50px;
  color:#ff3bff;
  text-shadow:0 0 25px #ff00ff;
  margin-bottom:10px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div>🏆 SCORE: <span id="score">0</span></div>
  <div>⭐ HIGH: <span id="high">0</span></div>
  <div>❤️ LIVES: <span id="lives">3</span></div>
</div>

<div id="startScreen">
  <h1>NEON RUSH</h1>
  <p>⚡ Dodge the enemies and survive as long as you can!</p>
  <p>🎮 Use ← → or A / D to move</p>
  <button onclick="startGame()">START GAME</button>
</div>

<div id="gameOver">
  <h2>GAME OVER</h2>
  <p>Your Score: <span id="finalScore">0</span></p>
  <button onclick="startGame()">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H;
let player;
let enemies=[];
let stars=[];
let score=0;
let lives=3;
let running=false;
let keys={};
let spawnTimer=0;
let speed=4;

let highScore=localStorage.getItem("neonRushHigh") || 0;
document.getElementById("high").textContent=highScore;

function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
  if(player) player.y=H-90;
}
window.addEventListener("resize",resize);
resize();

for(let i=0;i<100;i++){
  stars.push({
    x:Math.random()*W,
    y:Math.random()*H,
    s:Math.random()*2+1,
    speed:Math.random()*2+0.5
  });
}

function startGame(){
  score=0;
  lives=3;
  speed=4;
  enemies=[];
  spawnTimer=0;

  player={
    x:W/2,
    y:H-90,
    w:35,
    h:35,
    vx:0
  };

  document.getElementById("score").textContent=score;
  document.getElementById("lives").textContent=lives;

  document.getElementById("startScreen").style.display="none";
  document.getElementById("gameOver").style.display="none";

  running=true;
  requestAnimationFrame(loop);
}

function drawBackground(){
  ctx.fillStyle="#050510";
  ctx.fillRect(0,0,W,H);

  for(const star of stars){
    star.y+=star.speed;

    if(star.y>H){
      star.y=0;
      star.x=Math.random()*W;
    }

    ctx.fillStyle="#ffffff";
    ctx.globalAlpha=.7;
    ctx.fillRect(star.x,star.y,star.s,star.s);
  }

  ctx.globalAlpha=1;
}

function drawPlayer(){
  ctx.save();

  ctx.shadowBlur=25;
  ctx.shadowColor="#00ffff";

  ctx.fillStyle="#00ffff";

  ctx.beginPath();
  ctx.moveTo(player.x,player.y-25);
  ctx.lineTo(player.x-22,player.y+20);
  ctx.lineTo(player.x,player.y+10);
  ctx.lineTo(player.x+22,player.y+20);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#ffffff";
  ctx.beginPath();
  ctx.arc(player.x,player.y-3,7,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function spawnEnemy(){
  enemies.push({
    x:Math.random()*(W-40)+20,
    y:-40,
    size:25+Math.random()*20,
    speed:speed+Math.random()*3,
    rotation:0
  });
}

function drawEnemy(e){
  ctx.save();

  ctx.translate(e.x,e.y);
  e.rotation+=.04;
  ctx.rotate(e.rotation);

  ctx.shadowBlur=20;
  ctx.shadowColor="#ff00ff";
  ctx.fillStyle="#ff00ff";

  ctx.beginPath();

  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    const r=i%2===0?e.size:e.size*.45;
    const x=Math.cos(a)*r;
    const y=Math.sin(a)*r;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function collision(e){
  return(
    player.x-player.w/2 < e.x+e.size &&
    player.x+player.w/2 > e.x-e.size &&
    player.y-player.h/2 < e.y+e.size &&
    player.y+player.h/2 > e.y-e.size
  );
}

function update(){
  if(keys["ArrowLeft"] || keys["a"]){
    player.x-=7;
  }

  if(keys["ArrowRight"] || keys["d"]){
    player.x+=7;
  }

  player.x=Math.max(25,Math.min(W-25,player.x));

  spawnTimer++;

  if(spawnTimer>45){
    spawnEnemy();
    spawnTimer=0;
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];

    e.y+=e.speed;

    if(collision(e)){
      enemies.splice(i,1);
      lives--;

      document.getElementById("lives").textContent=lives;

      if(lives<=0){
        endGame();
        return;
      }

      continue;
    }

    if(e.y>H+60){
      enemies.splice(i,1);
      score++;

      document.getElementById("score").textContent=score;

      if(score%10===0){
        speed+=.4;
      }
    }
  }
}

function draw(){
  drawBackground();

  drawPlayer();

  for(const e of enemies){
    drawEnemy(e);
  }
}

function loop(){
  if(!running)return;

  update();
  draw();

  requestAnimationFrame(loop);
}

function endGame(){
  running=false;

  if(score>highScore){
    highScore=score;
    localStorage.setItem("neonRushHigh",highScore);
    document.getElementById("high").textContent=highScore;
  }

  document.getElementById("finalScore").textContent=score;
  document.getElementById("gameOver").style.display="flex";
}

window.addEventListener("keydown",e=>{
  keys[e.key]=true;
});

window.addEventListener("keyup",e=>{
  keys[e.key]=false;
});

/* Mobile touch controls */
canvas.addEventListener("touchmove",e=>{
  if(!running)return;

  const touch=e.touches[0];
  player.x=touch.clientX;

  e.preventDefault();
},{passive:false});
</script>

</body>
</html>
