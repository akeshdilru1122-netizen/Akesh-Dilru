<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
      text-align: center;
    }
    .card {
      width: min(90%, 600px);
      padding: 50px 30px;
      border-radius: 24px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    h1 { font-size: 48px; margin: 0 0 15px; }
    p { font-size: 20px; color: #e5e7eb; }
    button {
      margin-top: 20px;
      padding: 14px 28px;
      border: 0;
      border-radius: 999px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello! 👋</h1>
    <p>මේ මගේ පළමු HTML website එක.</p>
    <button onclick="alert('Thanks for visiting! 🎉')">Click Me</button>
  </div>
</body>
</html>
